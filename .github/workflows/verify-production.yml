name: verify-production

on:
  schedule:
    # Daily at 07:30 UTC — cheap read-only verification of the live production
    # deployment on the Cat Herding Games hub (routes, security headers and asset sha256 parity against a
    # freshly built dist/). No repository secrets are required.
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same build the Cat Herding Games hub produces (--base=/<slug>/), so sha256 parity holds.
      - run: npm run build -w @monster-league/arcade-hub -- --base=/monster-league-arcade/
      - name: Verify production deployment
        env:
          PROD_URL: https://games.cat-herding.net/monster-league-arcade/
        run: node scripts/verify-deployment.mjs "$PROD_URL"
