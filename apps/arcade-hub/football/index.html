<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSN 66.6 — Halloween Monster League Football</title>
  </head>
  <body>
    <div class="gsn-chrome" data-testid="gsn-chrome">
      <header class="gsn-header">
        <h1 class="gsn-brand">GSN 66.6</h1>
        <span class="gsn-brand__sub">Halloween Monster League Football</span>
      </header>
      <div class="gsn-toolbar">
        <a class="gsn-btn" href="../" data-testid="back-hub">Arcade Hub</a>
        <button class="gsn-btn" type="button" data-crt-toggle aria-pressed="false">
          CRT Scanlines
        </button>
        <button
          class="gsn-btn"
          type="button"
          data-mute-toggle
          data-testid="mute-toggle"
          aria-pressed="false"
        >
          Sound: On [M]
        </button>
      </div>
      <div id="scorebug" data-testid="scorebug"></div>
      <div class="gsn-stage">
        <div class="gsn-canvas-bezel" id="game" data-testid="game"></div>
      </div>
      <div class="gsn-huddle" id="huddle" data-testid="huddle"></div>
      <div class="gsn-banner" id="banner"></div>
      <div class="gsn-nasty-callout" id="nasty-callout" data-testid="nasty-callout" hidden></div>
      <div
        class="gsn-nasty-presnap"
        id="nasty-presnap-drawer"
        data-testid="nasty-presnap-drawer"
        hidden
      ></div>
      <div class="gsn-control-bar" data-testid="control-bar">
        <span class="gsn-control-bar__prompt"
          >Pre-Snap: <b>[C=L]</b> Hike · <b>[A=J]</b> Audible</span
        >
      </div>
    </div>
    <script type="module" src="/src/football.ts"></script>
  </body>
</html>
